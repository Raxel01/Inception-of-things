apiVersion: apps/v1
kind: Deployment
metadata:
  name: wil42-gitlab-deployment
  namespace: dev
  labels:
    app: wil42-gitlab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wil42-gitlab
  template:
    metadata:
      labels:
        app: wil42-gitlab
    spec:
      containers:
      - name: wil42
        image: wil42/playground:v1
        ports:
        - containerPort: 8888

---
apiVersion: v1
kind: Service
metadata:
  name: wil42-gitlab-service
spec:
  selector:
    app: wil42-gitlab
  ports:
    - protocol: TCP
      port: 8888
      targetPort: 8888

